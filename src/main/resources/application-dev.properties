# =====================================================================
# PERFIL DE DESARROLLO (H2 en memoria - no requiere Docker ni MySQL)
# Se activa por defecto al ejecutar con: .\mvnw.cmd spring-boot:run
# Consola H2 disponible en: http://localhost:8080/h2-console
#   JDBC URL: jdbc:h2:mem:tienda_libros
#   Usuario:  root
#   Contraseña: zxcvb
# =====================================================================
spring.application.name=librosonline
server.port=8080

spring.datasource.url=jdbc:h2:mem:tienda_libros;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.username=root
spring.datasource.password=zxcvb
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.thymeleaf.cache=false
spring.mvc.hiddenmethod.filter.enabled=true
