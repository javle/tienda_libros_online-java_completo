<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Libros Online</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #07101d;
            --border: rgba(255,255,255,.07);
            --text: #f1f5f9;
            --muted: #94a3b8;
            --accent: #22c55e;
            --accent-dark: #16a34a;
            --error-bg: rgba(239,68,68,.12);
            --error-border: rgba(239,68,68,.4);
            --success-bg: rgba(34,197,94,.12);
            --success-border: rgba(34,197,94,.4);
        }

        body {
            font-family: 'Inter', Arial, sans-serif;
            background: radial-gradient(ellipse at 50% 0%, #0d1f35 0%, var(--bg) 65%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: var(--text);
        }

        .topbar {
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            background: rgba(7,16,29,.8);
            backdrop-filter: blur(10px);
        }
        .brand { font-size: 1.2rem; font-weight: 800; color: var(--text); text-decoration: none; display: flex; align-items: center; gap: 8px; }
        .topbar-link { color: var(--muted); text-decoration: none; font-size: .9rem; transition: color .2s; }
        .topbar-link:hover { color: var(--text); }

        .page { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
        .card {
            width: 100%;
            max-width: 480px;
            background: linear-gradient(145deg, rgba(255,255,255,.04), rgba(255,255,255,.01));
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 40px 36px;
            box-shadow: 0 20px 60px rgba(0,0,0,.4);
        }

        .card-icon { font-size: 2.4rem; margin-bottom: 16px; display: block; text-align: center; }
        .card-title { font-size: 1.7rem; font-weight: 800; text-align: center; margin-bottom: 6px; }
        .card-sub { text-align: center; color: var(--muted); font-size: .9rem; margin-bottom: 28px; }

        .alert {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: .875rem;
            margin-bottom: 20px;
        }
        .alert-error { background: var(--error-bg); border: 1px solid var(--error-border); color: #fca5a5; }
        .alert-success { background: var(--success-bg); border: 1px solid var(--success-border); color: #86efac; }

        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: .85rem; font-weight: 600; color: var(--muted); margin-bottom: 7px; letter-spacing: .03em; text-transform: uppercase; }
        input[type="text"], input[type="password"], input[type="email"] {
            width: 100%;
            padding: 13px 16px;
            background: rgba(255,255,255,.04);
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 12px;
            color: var(--text);
            font-size: 1rem;
            font-family: inherit;
            transition: border-color .2s, background .2s;
            outline: none;
        }
        input:focus { border-color: var(--accent); background: rgba(34,197,94,.05); }
        input.is-invalid { border-color: var(--error-border); background: var(--error-bg); }
        input::placeholder { color: #475569; }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: #052e16;
            font-weight: 800;
            font-size: 1rem;
            font-family: inherit;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: background .2s, transform .1s;
            margin-top: 8px;
        }
        .btn-submit:hover { background: var(--accent-dark); color: #fff; }
        .btn-submit:active { transform: scale(.98); }

        .card-footer { text-align: center; margin-top: 22px; color: var(--muted); font-size: .875rem; }
        .card-footer a { color: var(--accent); text-decoration: none; font-weight: 600; }
        .card-footer a:hover { text-decoration: underline; }

        .field-error {
            color: #fca5a5;
            font-size: 0.8rem;
            margin-top: 6px;
            display: block;
            font-weight: 500;
        }
    </style>
</head>
<body>

<header class="topbar">
    <a class="brand" th:href="@{/}">📚 Libros Online</a>
    <a class="topbar-link" th:href="@{/login}">← Iniciar sesión</a>
</header>

<main class="page">
    <div class="card">
        <span class="card-icon">✨</span>
        <h1 class="card-title">Crear cuenta</h1>
        <p class="card-sub">Únete y empieza a explorar nuestra colección</p>

        <div class="alert alert-error" th:if="${mensajeError}" th:text="${mensajeError}"></div>
        <div class="alert alert-success" th:if="${mensajeExito}" th:text="${mensajeExito}"></div>

        <form th:action="@{/registro}" th:object="${registroForm}" method="post">
            <div class="form-group">
                <label for="nombre">Nombre completo</label>
                <input type="text" id="nombre" th:field="*{nombre}" placeholder="Juan Pérez" required autofocus th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid' : ''">
                <span class="field-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>
            </div>
            <div class="form-group">
                <label for="usuario">Nombre de usuario</label>
                <input type="text" id="usuario" th:field="*{usuario}" placeholder="juanperez123" required th:classappend="${#fields.hasErrors('usuario')} ? 'is-invalid' : ''">
                <span class="field-error" th:if="${#fields.hasErrors('usuario')}" th:errors="*{usuario}"></span>
            </div>
            <div class="form-group">
                <label for="correo">Correo electrónico</label>
                <input type="email" id="correo" th:field="*{correo}" placeholder="juan@ejemplo.com" required th:classappend="${#fields.hasErrors('correo')} ? 'is-invalid' : ''">
                <span class="field-error" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></span>
            </div>
            <div class="form-group">
                <label for="clave">Contraseña</label>
                <input type="password" id="clave" th:field="*{clave}" placeholder="Mínimo 6 caracteres" required th:classappend="${#fields.hasErrors('clave')} ? 'is-invalid' : ''">
                <span class="field-error" th:if="${#fields.hasErrors('clave')}" th:errors="*{clave}"></span>
            </div>
            <button class="btn-submit" type="submit">Crear mi cuenta</button>
        </form>

        <p class="card-footer">
            ¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a>
        </p>
    </div>
</main>

</body>
</html>
