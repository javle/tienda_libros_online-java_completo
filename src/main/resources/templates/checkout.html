<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Libros Online</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root{
            --bg:#07101d;
            --panel:rgba(255,255,255,.03);
            --border:rgba(255,255,255,.08);
            --text:#f8fafc;
            --muted:#94a3b8;
            --accent:#3b82f6; /* Azul tipo Stripe */
            --accent-dark:#2563eb;
            --shadow:0 12px 30px rgba(0,0,0,.2);
        }

        body{
            margin:0;
            font-family:'Inter', Arial, sans-serif;
            background:linear-gradient(180deg,#07101d 0%, #0b1120 100%);
            color:var(--text);
            min-height:100vh;
            display:flex;
            flex-direction:column;
        }

        .topbar {
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
            background: rgba(7,16,29,.8);
            backdrop-filter: blur(10px);
        }
        .brand { font-size: 1.2rem; font-weight: 800; color: var(--text); text-decoration: none; display: flex; align-items: center; gap: 8px; }
        .topbar-link { color: var(--muted); text-decoration: none; font-size: .9rem; transition: color .2s; font-weight:500;}
        .topbar-link:hover { color: var(--text); }

        .container {
            max-width:1100px;
            margin:0 auto;
            padding:40px 20px;
            flex:1;
            width:100%;
        }

        .page-title { font-size:2rem; font-weight:800; margin-bottom:30px; display:flex; align-items:center; gap:12px; }

        .checkout-grid {
            display:grid;
            grid-template-columns: 1.5fr 1fr;
            gap:40px;
            align-items:start;
        }

        .payment-card {
            background:linear-gradient(145deg, rgba(255,255,255,.04), rgba(255,255,255,.01));
            border:1px solid var(--border);
            border-radius:24px;
            padding:40px;
        }

        .payment-title { font-size:1.4rem; font-weight:700; margin:0 0 24px; }

        .form-group { margin-bottom: 20px; }
        .form-row { display:flex; gap:20px; }
        .form-row .form-group { flex:1; }

        label { display: block; font-size: .85rem; font-weight: 600; color: var(--muted); margin-bottom: 7px; text-transform: uppercase; letter-spacing:.05em;}
        input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(255,255,255,.05);
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 12px;
            color: var(--text);
            font-size: 1rem;
            font-family: inherit;
            transition: .2s;
            outline: none;
        }
        input:focus { border-color: var(--accent); background: rgba(59, 130, 246, .05); }
        input::placeholder { color: #475569; }

        .credit-card-wrapper { position:relative; }
        .card-icon { position:absolute; right:16px; top:50%; transform:translateY(-50%); font-size:1.4rem; color:var(--muted); }

        .summary-card {
            background:var(--panel);
            border:1px solid var(--border);
            border-radius:24px;
            padding:30px;
            position:sticky;
            top:100px;
        }

        .summary-item {
            display:flex;
            justify-content:space-between;
            margin-bottom:16px;
            padding-bottom:16px;
            border-bottom:1px solid rgba(255,255,255,.04);
            align-items:center;
        }
        .summary-item:last-of-type { border-bottom:none; margin-bottom:0; padding-bottom:0;}
        
        .item-info { display:flex; flex-direction:column; }
        .item-title { font-weight:600; font-size:1rem; }
        .item-qty { color:var(--muted); font-size:.85rem; margin-top:4px; }
        .item-price { font-weight:700; }

        .summary-total {
            display:flex;
            justify-content:space-between;
            margin-top:24px;
            padding-top:24px;
            border-top:1px dashed var(--border);
            font-size:1.4rem;
            font-weight:800;
        }

        .btn-pay {
            width:100%;
            padding:16px;
            background:var(--accent);
            color:#fff;
            border:none;
            border-radius:14px;
            font-size:1.1rem;
            font-weight:800;
            margin-top:30px;
            cursor:pointer;
            transition:.2s;
            display:flex;
            justify-content:center;
            align-items:center;
            gap:10px;
        }
        .btn-pay:hover { background:var(--accent-dark); transform:translateY(-2px); }

        .secure-badge {
            display:flex;
            align-items:center;
            justify-content:center;
            gap:8px;
            color:var(--muted);
            font-size:.85rem;
            margin-top:20px;
        }

        @media(max-width: 900px){ .checkout-grid { grid-template-columns: 1fr; } }
        @media(max-width: 500px){ .form-row { flex-direction:column; gap:0; } }
    </style>
</head>
<body>

<header class="topbar">
    <a class="brand" th:href="@{/}">📚 Libros Online</a>
    <a class="topbar-link" th:href="@{/carrito}">← Volver al carrito</a>
</header>

<main class="container">
    <h1 class="page-title">💳 Finalizar Compra</h1>

    <div class="checkout-grid">
        <!-- Formulario de Pago (Simulado) -->
        <div class="payment-card">
            <form th:action="@{/checkout/procesar}" method="post" id="payment-form">
                
                <h2 class="payment-title">Dirección de Envío</h2>
                <div class="form-group">
                    <label>Dirección Completa</label>
                    <input type="text" name="direccion" required placeholder="Ej. Calle Falsa 123, Apto 4">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Ciudad</label>
                        <input type="text" name="ciudad" required placeholder="Ciudad">
                    </div>
                    <div class="form-group">
                        <label>Código Postal</label>
                        <input type="text" name="codigoPostal" required placeholder="00000">
                    </div>
                </div>

                <div class="form-group" style="margin-bottom:40px;">
                    <label>Teléfono de Contacto</label>
                    <input type="tel" name="telefono" required placeholder="1234567890">
                </div>

                <h2 class="payment-title" style="border-top:1px solid var(--border); padding-top:24px;">Información de Pago</h2>
                
                <div class="form-group">
                    <label>Nombre del Titular</label>
                    <input type="text" th:value="${usuario.nombre}" required placeholder="Ej. Juan Pérez">
                </div>

                <div class="form-group">
                    <label>Correo Electrónico (Recibo)</label>
                    <input type="email" th:value="${usuario.correo}" required readonly style="opacity:0.7;">
                </div>

                <div class="form-group">
                    <label>Número de Tarjeta</label>
                    <div class="credit-card-wrapper">
                        <input type="text" placeholder="0000 0000 0000 0000" maxlength="19" required pattern="\d{4}\s?\d{4}\s?\d{4}\s?\d{4}" title="Formato: 1234 5678 1234 5678">
                        <span class="card-icon">💳</span>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Vencimiento</label>
                        <input type="text" placeholder="MM/YY" maxlength="5" required pattern="(0[1-9]|1[0-2])\/[0-9]{2}">
                    </div>
                    <div class="form-group">
                        <label>CVV</label>
                        <input type="password" placeholder="123" maxlength="4" required pattern="\d{3,4}">
                    </div>
                </div>

                <button type="submit" class="btn-pay">
                    <span>Pagar</span>
                    <span th:text="'$ ' + ${#numbers.formatDecimal(total, 0, 'COMMA', 0, 'POINT')}"></span>
                </button>
                
                <div class="secure-badge">
                    <span>🔒</span> Los pagos son procesados de forma segura (Modo Simulación)
                </div>
            </form>
        </div>

        <!-- Resumen -->
        <div class="summary-card">
            <h2 class="payment-title" style="margin-bottom:20px; font-size:1.2rem;">Tu Orden</h2>
            
            <div th:each="item : ${items}" class="summary-item">
                <div class="item-info">
                    <span class="item-title" th:text="${item.titulo}"></span>
                    <span class="item-qty" th:text="'Cant: ' + ${item.cantidad}"></span>
                </div>
                <div class="item-price" th:text="'$ ' + ${#numbers.formatDecimal(item.subtotal, 0, 'COMMA', 0, 'POINT')}"></div>
            </div>

            <div class="summary-total">
                <span>Total a pagar</span>
                <span style="color:var(--accent);" th:text="'$ ' + ${#numbers.formatDecimal(total, 0, 'COMMA', 0, 'POINT')}"></span>
            </div>
        </div>
    </div>
</main>

<script>
    // Pequeño script para formatear la tarjeta con espacios
    document.querySelector('.credit-card-wrapper input').addEventListener('input', function (e) {
        let val = e.target.value.replace(/\D/g, '');
        let formatted = val.match(/.{1,4}/g)?.join(' ') || val;
        e.target.value = formatted;
    });

    // Formatear MM/YY
    document.querySelector('input[placeholder="MM/YY"]').addEventListener('input', function (e) {
        let val = e.target.value.replace(/\D/g, '');
        if (val.length > 2) {
            val = val.substring(0,2) + '/' + val.substring(2,4);
        }
        e.target.value = val;
    });
</script>

</body>
</html>
