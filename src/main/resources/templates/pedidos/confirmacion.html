<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Gracias por tu compra! | Libros Online</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root{
            --bg:#07101d;
            --panel:rgba(255,255,255,.03);
            --border:rgba(255,255,255,.08);
            --text:#f8fafc;
            --muted:#94a3b8;
            --success:#10b981;
            --success-glow:rgba(16, 185, 129, 0.4);
        }

        body{
            margin:0;
            font-family:'Inter', Arial, sans-serif;
            background:linear-gradient(180deg,#07101d 0%, #0b1120 100%);
            color:var(--text);
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
        }

        .success-card {
            background:var(--panel);
            border:1px solid var(--border);
            border-radius:24px;
            padding:60px 40px;
            text-align:center;
            max-width:500px;
            box-shadow: 0 20px 40px rgba(0,0,0,.4);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .icon-circle {
            width:100px;
            height:100px;
            background:rgba(16,185,129,.1);
            border:2px solid var(--success);
            border-radius:50%;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:3rem;
            color:var(--success);
            margin:0 auto 30px;
            box-shadow: 0 0 20px var(--success-glow);
        }

        .title { font-size:2rem; font-weight:800; margin:0 0 16px; }
        .desc { color:var(--muted); font-size:1.05rem; margin:0 0 30px; line-height:1.5; }
        
        .order-badge {
            display:inline-block;
            background:rgba(255,255,255,.05);
            border:1px dashed rgba(255,255,255,.2);
            padding:12px 24px;
            border-radius:12px;
            font-family:monospace;
            font-size:1.1rem;
            color:#cbd5e1;
            margin-bottom:40px;
        }

        .btn-group { display:flex; gap:16px; justify-content:center; flex-wrap:wrap;}

        .btn {
            padding:14px 24px;
            border-radius:12px;
            font-weight:700;
            text-decoration:none;
            transition:.2s;
        }

        .btn-primary { background:var(--success); color:#064e3b; }
        .btn-primary:hover { background:#059669; color:#fff; transform:translateY(-2px);}
        
        .btn-secondary { background:transparent; border:1px solid var(--border); color:var(--text); }
        .btn-secondary:hover { background:rgba(255,255,255,.05); }

    </style>
</head>
<body>

    <div class="success-card">
        <div class="icon-circle">✓</div>
        <h1 class="title">¡Pago Exitoso!</h1>
        <p class="desc">Tu orden ha sido procesada correctamente. Enviaremos un recibo a tu correo electrónico junto con los detalles de envío.</p>
        
        <div class="order-badge">
            Orden #<span th:text="${pedidoId}">12345</span>
        </div>

        <div class="btn-group">
            <a th:href="@{/pedidos}" class="btn btn-primary">Ver mis pedidos</a>
            <a th:href="@{/}" class="btn btn-secondary">Seguir explorando</a>
        </div>
    </div>

</body>
</html>
